<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Privacy · Riopalabras</title>
    <!-- Nothing on this page comes from another site: no fonts, no scripts, no analytics. The text is the system's own face (the app's stack falls back to it). -->
    <!-- theme-bootstrap-privacy: sets data-theme before the first paint, as index.html does, without anything of Telegram's (a test runs it against resolveScheme) -->
    <script>
      (function () {
        try {
          var stored = null
          try {
            stored = localStorage.getItem('riopalabras.theme.v1')
          } catch (e) {}
          var osDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var scheme = stored === 'light' || stored === 'dark' ? stored : osDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', scheme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/privacy-main.tsx"></script>
  </body>
</html>
