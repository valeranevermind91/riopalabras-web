<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Riopalabras</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- theme-bootstrap: sets data-theme before the first paint, mirroring resolveTheme() in src/lib/theme.ts (a test runs this script against it) -->
    <script>
      (function () {
        try {
          var stored = null
          try {
            stored = localStorage.getItem('riopalabras.theme.v1')
          } catch (e) {}
          var tg = window.Telegram && window.Telegram.WebApp
          var tgScheme = tg && tg.initData ? (tg.colorScheme === 'dark' ? 'dark' : 'light') : null
          var osDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var scheme = stored === 'light' || stored === 'dark' ? stored : tgScheme || (osDark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', scheme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
